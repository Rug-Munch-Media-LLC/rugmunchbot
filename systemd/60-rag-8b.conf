# 2026-10-01: the bot's semantic search was DEAD, not degraded-by-design.
#
# RMI_EMBED_URL defaulted to http://127.0.0.1:8004/v1/embeddings and
# RMI_EMBED_MODEL to qwen3-embedding-4b. Port 8004 is the RETIRED 2560-dim 4B
# lane and nothing is listening on it any more — only leftover socat proxies on
# container bridge addresses. The bot logged "embed_unavailable" and silently
# degraded to a keyword table, so every consumer question was answered by
# substring match instead of semantic retrieval, with nothing on the surface.
#
# The real 8B lane is DeepInfra Qwen3-Embedding-8B at 4096 dims, the same one
# RugBrain uses. Set here rather than in code so the capability is visible in
# `systemctl cat` instead of a default buried in a Python module.
[Service]
Environment=RMI_EMBED_URL=https://api.deepinfra.com/v1/embeddings
Environment=RMI_EMBED_MODEL=Qwen/Qwen3-Embedding-8B
Environment=DEEPINFRA_BASE=https://api.deepinfra.com/v1/openai
