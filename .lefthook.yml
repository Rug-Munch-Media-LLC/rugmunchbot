# ── lefthook.yml — fast git hooks (replaces pre-commit) ──
# Source of truth: standards/templates/lefthook.yml.template
# Copy to repo root as lefthook.yml
# Install: lefthook install

pre-commit:
  parallel: true
  commands:
    no-env-files:
      run: |
        if find . -maxdepth 3 -name '.env' -not -name '.env.example' -not -path './.git/*' -not -path './node_modules/*' -not -path './venv/*' -not -path './.venv/*' | grep -q .; then
          echo "ERROR: .env files found. Move secrets to gopass. See AGENTS.md hard-rule 6."
          find . -maxdepth 3 -name '.env' -not -name '.env.example' -not -path './.git/*' -not -path './node_modules/*' -not -path './venv/*' -not -path './.venv/*'
          exit 1
        fi
      skip:
        - merge
        - rebase
    envsitter:
      run: envsitter validate --file .env.example
    gitleaks:
      run: gitleaks detect --verbose --redact --no-git
    ruff:
      run: ruff check --fix && ruff format

pre-push:
  parallel: true
  commands:
    mypy:
      run: mypy --strict --exclude '_ARCHIVED/' .
      tags: [python]
    bandit:
      run: bandit -r .
      tags: [python]
    gitleaks-full:
      run: gitleaks detect --verbose --redact

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
