# RugMunchBot lefthook config — repo-local override of the canonical
# standards/lefthook.yml.
#
# WHY NOT A SYMLINK: the canonical hook runs `ruff check --fix && ruff
# format` on staged *.py with stage_fixed. ruff 0.15.x rewrites
# EXPLICITLY-PASSED files even when they are excluded in pyproject, and
# lefthook's auto-merge of .lefthook.local.yml does not apply when the main
# config is a symlink (local discovery happens beside the RESOLVED file,
# i.e. in standards/). Both mechanisms let the hook rewrite
# src/rugmunchbot (a byte-identical snapshot of the LIVE bot) at commit
# time, silently breaking the drift gate.
#
# This file includes the canonical config and replaces ONLY the ruff
# command with a path-filtered wrapper that skips src/rugmunchbot.
#
# WARNING: this file MUST stay a real file, never a symlink to standards/
# (writing through the old symlink clobbered standards/lefthook.yml once —
# restored 2026-08-17 from git).
include: ../standards/lefthook.yml

pre-commit:
  commands:
    ruff:
      glob: "*.py"
      run: bash scripts/ruff-staged.sh {staged_files}
      stage_fixed: true


# ── post-commit: Zoekt incremental reindex ──────────────────────────
# Zoekt is the fastest retrieval layer (1-200ms) and every other layer is
# live, so agents prefer it and silently get stale answers. Refresh was only
# the timers (own: 4x/day, refresh: Mon/Wed/Fri 03:30) — a commit was
# invisible for up to 6h. This makes the common case instant; the timers stay
# as the reconciler.
#
# WHY IT LIVES HERE AND NOT IN .git/hooks/: `lefthook install` CLOBBERS
# hand-written .git/hooks. A hook written straight into .git/hooks/ is
# therefore destroyed by the fleet's own installer, and it is unversioned so
# it cannot be reviewed. This config is versioned.
#
# The work is in standards/scripts/zoekt-incremental.sh so there is ONE copy
# to keep correct instead of N. `../standards` is the sibling-relative path
# for a repo directly under /srv/work/repos.
#
# NEVER BLOCKS the commit: the script detaches, flocks against the timer,
# caps itself with a timeout, and returns 0 on every failure. A search index
# must not be able to block the commit that fixes the code.
post-commit:
  commands:
    zoekt-incremental:
      # Advisory in one sense only: the script owns the exit status. Non-own
      # repos (the 255 vendored corpus clones) are skipped inside the script.
      run: |
        if [ -x standards/scripts/zoekt-incremental.sh ]; then
          standards/scripts/zoekt-incremental.sh || true
        elif [ -x ../standards/scripts/zoekt-incremental.sh ]; then
          ../standards/scripts/zoekt-incremental.sh || true
        fi
