[project]
name = "rugmunchbot"
version = "0.1.0"
description = "RugMunchBot — Telegram token scanner, wallet forensics, and market intelligence bot (self-hostable)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "pillow>=10.0.0",
    "cachetools>=5.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
# Operator-provided adapters: scanner backends, billing, LLM routers.
# The base install ships with public-API defaults (DexScreener/GoPlus/Honeypot)
# and no-op fallbacks — see src/rugmunchbot/plugins/.
scanner = [
    "rugmunch-scanner>=0.2.0",
]
billing = []
dev = [
    "pytest-timeout",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "bandit>=1.9.0",
    "semgrep>=1.176.0",
    "import-linter>=2.15",
    "vulture>=2.16",
    "respx>=0.23.1",
    "gitleaks>=8.18",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "bot",          # stale deprecated tree — removed in Stage 0
    "src/rugmunchbot",  # byte-identical live snapshot — linted in rmi-backend, never auto-fixed here
    "tests",        # stale tests of the deprecated tree — replaced by ported live tests in Stage 5
]

[tool.ruff.lint]
# asyncio.timeout modernization (ASYNC109) is a preview style preference — the
# ported bot code's legacy asyncio.wait_for / timeout-param usage predates it.
# Tolerate it rather than churning runtime call sites (mirrors rmi-backend).
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/rugmunchbot/plugins/*.py" = ["S101"]
# Vendored scanner-engine analytics SQL: identifiers are code constants,
# values are parameterized via client.execute params (reviewed 2026-08-21).
"src/rugmunchbot/_vendor/scanner_engines/_deployer_fingerprint_queries.py" = ["S608"]
"src/rugmunchbot/_vendor/scanner_engines/_sources.py" = ["S608"]
"src/rugmunchbot/_vendor/scanner_engines/event_correlation.py" = ["S608"]
"src/rugmunchbot/_vendor/scanner_engines/own_volume_authenticity.py" = ["S608"]
# Ported fail-open fallbacks: try/except/pass is intentional (Redis down,
# import guards) — same convention as the live rmi-backend per-file ignores.
"src/rugmunchbot/admin_state.py" = ["S110"]
"src/rugmunchbot/daily_context.py" = ["S110"]
# F811: duplicate is_owner import pre-exists in the LIVE source —
# ignored the same way rmi-backend does (per-file-ignores, F811).
"src/rugmunchbot/__init__.py" = ["F811"]
# Ported renderer nit (ambiguous loop var) — keep behavior identical.
"src/rugmunchbot/formatters/_advanced.py" = ["E741"]
# Ported handlers carry intentional try/except/contextmanager patterns that
# pre-exist in the live source — ignore the same way rmi-backend does so CI
# does not block the ported code.
"src/rugmunchbot/handlers/scanning.py" = ["S110", "SIM105"]
"src/rugmunchbot/handlers/webhook.py" = ["B904"]
"src/rugmunchbot/bot/_profile.py" = ["S110", "S311"]
"src/rugmunchbot/config/_secrets.py" = ["S603", "S607"]
"src/rugmunchbot/alert_worker.py" = ["F401"]
"src/rugmunchbot/commands/rugmap.py" = ["F821", "F841"]
"src/rugmunchbot/formatters.py" = ["E741", "PIE810"]
"src/rugmunchbot/handlers/_scan_handlers.py" = ["S110", "SIM105"]
"src/rugmunchbot/scanner.py" = ["F601"]
"src/rugmunchbot/services/visuals.py" = ["B007", "F841"]
"src/rugmunchbot/ta_indicators.py" = ["RUF002", "RUF022"]
"src/rugmunchbot/formatters/_sentinel.py" = ["PIE810", "E741"]
# Mirrored from rmi-backend per-file-ignores (live bot lint debt) — snapshot
# must stay byte-identical to live; lint rules align with live.


[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    ".venv/",
    # Anchored: mypy matches exclude entries as unanchored regexes, so a bare
    # "bot/" also matches src/rugmunchbot/ (substring "bot/") and would exclude
    # the entire package. "^bot/" only skips the legacy bot/ tree at the root.
    "^bot/",
    "tests/stale/",
]

# numpy 2.5.x stubs use PEP 695 `type` statements (Python 3.12+ syntax), which
# mypy cannot parse when python_version = "3.11". numpy is not a declared
# dependency — it is pulled into the check only via PIL's TYPE_CHECKING import
# of numpy.typing. Treat numpy as untyped Any rather than failing the whole run.
# This does not weaken checks on our own code (see follow_imports docs).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120  # per-test hard timeout (pytest-timeout) — the suite hung once in prod; see TECH-DEBT.md

# ── import-linter — architectural contracts (wired 2026-08-21) ──────────────
# Locks in the god-file modularization: foundational packages stay leaf
# modules; presentation never reaches into orchestration. Run: lint-imports
[tool.importlinter]
root_package = "rugmunchbot"

[[tool.importlinter.contracts]]
name = "config is a foundation package (no upward imports)"
type = "forbidden"
source_modules = ["rugmunchbot.config"]
forbidden_modules = [
    "rugmunchbot.handlers",
    "rugmunchbot.channels",
    "rugmunchbot.keyboards",
    "rugmunchbot.formatters",
    "rugmunchbot.tools",
    "rugmunchbot.bot",
]

[[tool.importlinter.contracts]]
name = "keyboards never import orchestration"
type = "forbidden"
source_modules = ["rugmunchbot.keyboards"]
forbidden_modules = [
    "rugmunchbot.channels",
    "rugmunchbot.tools",
    "rugmunchbot.bot",
]

[[tool.importlinter.contracts]]
name = "formatters never import orchestration"
type = "forbidden"
source_modules = ["rugmunchbot.formatters"]
forbidden_modules = [
    "rugmunchbot.channels",
    "rugmunchbot.keyboards",
    "rugmunchbot.bot",
]

[[tool.importlinter.contracts]]
name = "tools never import orchestration"
type = "forbidden"
source_modules = ["rugmunchbot.tools"]
forbidden_modules = [
    "rugmunchbot.handlers",
    "rugmunchbot.channels",
    "rugmunchbot.keyboards",
    "rugmunchbot.bot",
]

[[tool.importlinter.contracts]]
name = "handlers never import bot or channel jobs"
type = "forbidden"
source_modules = ["rugmunchbot.handlers"]
forbidden_modules = [
    "rugmunchbot.bot",
    "rugmunchbot.channels.scheduler",
]
