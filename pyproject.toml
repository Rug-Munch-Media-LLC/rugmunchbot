[project]
name = "rugmunchbot"
version = "0.1.0"
description = "RugMunchBot — Telegram token scanner, wallet forensics, and market intelligence bot (self-hostable)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "pillow>=10.0.0",
    "cachetools>=5.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
# Operator-provided adapters: scanner backends, billing, LLM routers.
# The base install ships with public-API defaults (DexScreener/GoPlus/Honeypot)
# and no-op fallbacks — see src/rugmunchbot/plugins/.
scanner = []
billing = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.10",
    "respx>=0.21",
    "gitleaks>=8.18",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "bot",          # stale deprecated tree — removed in Stage 0
    "tests",        # stale tests of the deprecated tree — replaced by ported live tests in Stage 5
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"src/rugmunchbot/plugins/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    ".venv/",
    "bot/",
    "tests/stale/",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
