[project]
name = "rugmunchbot"
version = "0.1.0"
description = "RugMunch Telegram Bot (@rugmunchbot) — token scanner, wallet forensics, market intelligence"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20.0",
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.0",
    "pillow>=10.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "psutil>=6.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".git/",
    "__pycache__/",
    ".venv/",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
