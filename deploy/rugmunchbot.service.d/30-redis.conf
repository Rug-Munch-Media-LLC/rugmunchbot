[Service]
# ── 2026-08-31: bot-owned redis (decoupled from shared host rmi-redis) ──
# The bot runs on the HOST via systemd. It MUST use its OWN redis
# (rugmunchbot-redis container, published on 127.0.0.1:6380 per docker-compose.yml)
# — never the shared host redis-server.service (:6379) that rmi-backend uses.
#
# This drop-in sorts after 10-jwt-secret.conf (the EnvironmentFile that holds
# the legacy REDIS_URL=...@127.0.0.1:6379/0), so these Environment= lines
# override it. RUGMUNCHBOT_REDIS_PASSWORD must be defined in the EnvironmentFile
# (/srv/secrets/rugmunchbot.env) and match the bot-owned redis requirepass.
Environment=REDIS_HOST=127.0.0.1
Environment=REDIS_PORT=6380
Environment=REDIS_URL=redis://:${RUGMUNCHBOT_REDIS_PASSWORD}@127.0.0.1:6380/0
