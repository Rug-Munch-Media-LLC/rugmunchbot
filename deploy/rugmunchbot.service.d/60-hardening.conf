[Service]
# ── 2026-08-18 hardening drop-in ──
# ProtectHome=true intentionally NOT set: gopass must mkdir /root/.local at
# store init and ReadWritePaths bind-mounts cannot override the ProtectHome
# mask for that mkdir. CapabilityBoundingSet keeps CAP_DAC_OVERRIDE (root's
# inherent file-access cap — gopass/gpg store init needs it); the real
# protections are NoNewPrivileges + ProtectSystem=strict + syscall filter +
# address-family restriction + empty AmbientCapabilities.
ProtectSystem=strict
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=CAP_DAC_OVERRIDE
AmbientCapabilities=
UMask=0077
KeyringMode=private
SystemCallArchitectures=native
SystemCallFilter=@system-service
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
TimeoutStopSec=20
# Writable paths beyond the main unit's whitelist:
#   /root/.local        — gopass mkdirs the store parent at init
#   /var/lib/rugmunchbot — BOT_DB_PATH (sqlite WAL needs write)
#   /root/.cache        — HF hub model cache (guardrails Detoxify)
ReadWritePaths=/root/.local /var/lib/rugmunchbot /root/.cache
