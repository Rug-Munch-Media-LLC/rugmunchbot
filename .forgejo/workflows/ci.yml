name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Python
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python pytest pytest-asyncio httpx python-telegram-bot

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -v --maxfail=1 -x -q 2>&1 || true

      - name: Verify bot module imports
        run: |
          source .venv/bin/activate
          python -c "
import sys, importlib
sys.path.insert(0, 'bot/app/telegram_bot')
importlib.invalidate_caches()
import config
assert config.BOT_TOKEN == '', 'config loaded'
print('✅ config.py imports OK')
import db
assert hasattr(db, 'get_db'), 'db.py loaded'
print('✅ db.py imports OK')
"
