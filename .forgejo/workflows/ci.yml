name: CI

# Per-push CI. Split by MEASURED dispatch budget 2026-10-25.
# Fleet capacity: 2 slots x ~90s/job = ~80 job-slots/hour; run arrival
# ~60/hour => budget ~1.3 job-slots per run. This file now carries the
# merge gates only; slow/periodic gates live in nightly.yml (same jobs,
# same scripts, different schedule).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per ref, and NEVER cancel in progress: a cancelled run
  # finalises status=3 with every job at task_id=0, so the commit gets no
  # check at all. With 4-5 jobs/run the queue drains instead.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Change classification (standards fleet/CI-RUNNER.md §8) ────
  # One question: did this diff touch anything a gate executes? A docs-only
  # answer lets the expensive job report SUCCESS without re-running a suite a
  # markdown file cannot affect. It removes no check: `security` (gitleaks),
  # `lint` and `structure-gate` stay unconditional — a token pasted into a .md
  # is still a leak. `on.pull_request.paths:` is NOT used: Forgejo documents
  # `paths` under on.push only, and a workflow that never fires publishes no
  # status for a required context, which blocks the PR forever.
  changes:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
      options: >-
        --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        run: |
          set -eu
          script=/workspace/RugMunchMedia/standards/scripts/ci/changed-paths.sh
          if [ ! -f "$script" ]; then
            echo "::warning::classifier missing at $script — running the full pipeline"
            echo "code=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            exit 0
          fi
          bash "$script"

  lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
      # standards: ruff config extends ../standards/templates/ruff-base.toml.
      # scanner: OSS sibling repo, not on PyPI. Both host paths whitelisted
      # in the runner config valid_volumes.
      options: >-
        --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
        --volume /srv/work/repos/rugmunch-scanner:/opt/rugmunch-scanner:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Setup Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - name: Install dev dependencies
        run: uv pip install --python .venv/bin/python ruff
      - name: Ruff check
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix
      - name: Ruff format check
        run: source .venv/bin/activate && ruff format --check .

  # ── Tests ─────────────────────────────────────────────────────
  test:
    runs-on: docker-x64
    needs: [changes]
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
      # Fleet scanner (OSS sibling; not on PyPI) from the host checkout,
      # whitelisted in the runner config valid_volumes.
      options: --volume /srv/work/repos/rugmunch-scanner:/opt/rugmunch-scanner:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the per-diff coverage gate (diff-cover) needs
          # origin/main as the diff base.
          fetch-depth: 0
      # Always runs, always prints the decision, so a green job cannot hide a
      # skip. The guard is `!= 'false'`: an unset output runs the suite.
      - name: Change classification
        env: {CODE_CHANGED: "${{ needs.changes.outputs.code }}"}
        run: |
          set -eu
          echo "code_changed=${CODE_CHANGED:-true}"
          if [ "${CODE_CHANGED:-true}" = "false" ]; then
            echo "docs-only change: no path this gate executes was touched — green without running the suite"
          fi
      - name: Install system deps
        if: needs.changes.outputs.code != 'false'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git build-essential curl ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Install uv
        if: needs.changes.outputs.code != 'false'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Setup Python
        if: needs.changes.outputs.code != 'false'
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
      - name: Cache uv wheels
        if: needs.changes.outputs.code != 'false'
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: |
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          uv pip install --python .venv/bin/python httpx python-telegram-bot
          # Fleet scanner (OSS sibling; not on PyPI) from the mounted checkout.
          uv pip install --python .venv/bin/python /opt/rugmunch-scanner
          if [ -f "requirements.txt" ]; then
            uv pip install --python .venv/bin/python -r requirements.txt
          fi
          # Install the package itself so `import rugmunchbot` and
          # --cov=src/rugmunchbot resolve deterministically in CI.
          uv pip install --python .venv/bin/python -e .
      - name: Run unit tests with coverage (BLOCKING)
        if: needs.changes.outputs.code != 'false'
        # Tests MUST pass and coverage must meet the ratchet floor on the
        # live package tree (src/rugmunchbot). Floor re-based 2026-08-21:
        # the de-godding waves added ~2k lines of package scaffolding which
        # diluted total coverage 30% -> 24%; re-based to measured reality and
        # raised as test waves land (wave7-10 2026-08-22: 27% measured -> floor
        # 26%; next: _extras + deepscan sentinel + command handlers -> target 30%).
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --tb=short \
            --cov=src/rugmunchbot \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.lcov \
            --cov-fail-under=42
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code != 'false'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Per-diff coverage gate (diff-cover — BLOCKING)
        if: needs.changes.outputs.code != 'false'
        # Ratchet: lines CHANGED vs origin/main must be >=46% covered
        # (measured 51% after wave21, 2026-08-22).
        # On pushes to main the diff is empty and this passes trivially.
        run: |
          source .venv/bin/activate
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=46
      - name: Upload coverage
        # Forgejo act_runner implements only the artifact v1 API. Every
        # upload-artifact@v4+ release ships @actions/artifact v2, which raises
        # GHESNotSupportedError and emits a workflow `::error::` -> the step
        # exits 1 and fails an otherwise green test job (observed on 4f9e10b:
        # pytest 3065 passed, diff-cover 100%, job failed on this step alone).
        # Pin the v1-API major, and keep a report upload non-gating: its
        # failure must never decide the test verdict.
        uses: actions/upload-artifact@v3
        if: always() && needs.changes.outputs.code != 'false'
        continue-on-error: true
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.lcov

  # ── Security (gitleaks) ───────────────────────────────────────
  security:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install system deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Install gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - name: Gitleaks secret scan
        run: gitleaks detect --source . --no-banner --exit-code 1 --verbose

  structure-gate:
    # Anti-god-module + anti-monkeypatch ratchet (baseline:
    # scripts/structure-baseline.json). Shrink freely; growth or NEW
    # offenders fail the build. Regenerate deliberately: --update-baseline.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Structure gate
        run: python3 scripts/check-code-structure.py
      - name: Antipattern gate (per-repo ratchet)
        run: python3 scripts/check-antipatterns.py --repo .
