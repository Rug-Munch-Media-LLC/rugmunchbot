# RugMunchBot repo-local lefthook overrides (merged with canonical .lefthook.yml).
#
# CRITICAL: src/rugmunchbot is a byte-identical snapshot of the LIVE bot
# (rmi-backend/app/domains/telegram/rugmunchbot). ruff --fix / ruff format
# must NEVER rewrite it — the canonical hook auto-formats staged *.py, which
# broke the snapshot's byte-identity (Phase 0 regression). This override
# excludes src/rugmunchbot from fix/format; the sync script is the ONLY
# writer of that tree.
pre-commit:
  commands:
    ruff:
      glob: "*.py"
      run: ruff check --fix --extend-exclude src/rugmunchbot {staged_files} && ruff format --extend-exclude src/rugmunchbot {staged_files}
      stage_fixed: true
