# rugmunchbot — Telegram bot (production compose)
# Fleet rule: NO .env files — populate values via operator environment / gopass.
# Long-polling bot: no HTTP listener → restart policy is the recovery mechanism.
services:
  rugmunchbot:
    build: .
    image: rugmunch/rugmunchbot:latest
    restart: unless-stopped
    depends_on:
      rugmunchbot-redis:
        condition: service_started
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set from gopass}
      BOT_DB_PATH: ${BOT_DB_PATH:-/data/rugmunchbot.db}
      # Own redis for durable bot state (flood control, scheduler, dedup, caches).
      # Decoupled from rmi-redis: if the bot needs rmi data it goes over HTTP,
      # never by reaching rmi's redis / db directly.
      REDIS_URL: ${REDIS_URL:-redis://rugmunchbot-redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-rugmunchbot-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:+}
      ARKHAM_API_KEY: ${ARKHAM_API_KEY:+}
    volumes:
      - bot-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9191/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  rugmunchbot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
  bot-redis-data:
